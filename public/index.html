    <!-- =========================================
         Scroll Restoration — claim it before anything else
         -----------------------------------------
         This is a lazy-route SPA: on a reload the document is a stub when
         the browser applies its saved scroll offset, then the route chunk
         mounts and grows it back. With the default "auto" mode the browser
         re-applies the pre-reload offset AFTER that growth, landing the
         visitor mid-page — on the short /contact route that is inside the
         footer. ScrollManager (src/App.jsx) owns route scrolling instead.

         Deliberately inline, first thing in <head>, for two reasons:
         1. it beats the browser's own restore, which the main bundle does not,
         2. gsap/ScrollTrigger caches history.scrollRestoration at import time
            and writes its cached copy back on every refresh() — so whatever
            is set here is what GSAP keeps re-asserting. Setting it later
            (from a React effect) gets silently reverted to "auto".
         src/animations/gsapSetup.js calls ScrollTrigger.clearScrollMemory
         ('manual') so GSAP's cached copy agrees with this one and keeps
         re-asserting it rather than fighting it.
         ========================================= -->
    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      document.documentElement.setAttribute("data-surface", /^\/admin(\/|$)/.test(location.pathname) ? "admin" : "public");
    </script>

    <!-- Round full stop + open ampersand. `text=.%26` subsets Inter to two
         glyphs (~2.2 KB) and Google emits `unicode-range: U+26, U+2e` on every
         @font-face, so this replaces Archivo's square period and its closed
         rotated-8 ampersand site-wide and nothing else. It is what puts 'Inter'
         at the head of the sans stacks in variables.css. The `%26` must stay
         percent-encoded — a bare `&` would terminate the `text` param. -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&text=.%26&display=swap"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&text=.%26&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Splash mark preload. The initial loader draws this on every route's
         first paint, and it sits in <body> markup the parser only reaches
         after all of <head>, so preloading here starts the fetch earlier.
         Same-origin and immutably cached (see public/.htaccess), so it costs
         one request on a first visit and nothing afterwards. Keep in sync with
         the <img> in the initial loader below and `logoMark` in
         src/data/siteConfig.js. -->
    <link
      rel="preload"
      as="image"
      type="image/png"
      href="%PUBLIC_URL%/images/logo/dls-mark-860.png"
      fetchpriority="high"
    />

    <!-- =========================================
         LCP image preload — home route only
         --------------------------------------------
         The Home hero photograph is the largest above-the-fold asset and
         lives inside a React-rendered section, so without a preload it is
         not discovered until the main bundle has parsed and mounted. That
         makes this preload load-bearing rather than an optimisation.

         This is a SPA: index.html is served for every route, so a static
         <link rel="preload"> here would also download the hero on every
         other route, where it is never used. The guard keeps the preload for
         `/` and skips it everywhere else. Runs synchronously in <head>, so
         discovery still happens long before the bundle executes.

         The hero is art-directed: the 4:5 crop below 768 px, the 16:9 crop
         from 768. Each preload carries its crop's AVIF set with `media`,
         `imagesrcset` and `imagesizes`, so the browser fetches exactly the
         candidate the <picture> will pick, and only one of the two. `type`
         keeps it honest: a browser without AVIF skips both and the picture
         falls back to WebP / JPEG on its own.

         Keep the sets in sync with `home-hero-tall` / `home-hero-wide` in
         src/data/imageManifest.json and with `ART` and `sizes` in
         src/pages/Home/sections/HeroSection.jsx.

         The italic Fraunces face is preloaded here too, for `/` only: the
         hero headline's second line is the italic accent, and without it the
         swap from the fallback face reflows the headline.
         ========================================= -->
    <script>
      (function () {
        if (window.location.pathname !== "/") return;
        var head = document.head;
        var heroes = [
          {
            media: "(max-width: 767px)",
            srcset:
              "/images/inarch/home-hero-tall-480.avif 480w, /images/inarch/home-hero-tall-768.avif 768w, /images/inarch/home-hero-tall-1080.avif 1080w",
          },
          {
            media: "(min-width: 768px)",
            srcset:
              "/images/inarch/home-hero-wide-768.avif 768w, /images/inarch/home-hero-wide-1080.avif 1080w, /images/inarch/home-hero-wide-1440.avif 1440w, /images/inarch/home-hero-wide-1920.avif 1920w",
          },
        ];
        for (var i = 0; i < heroes.length; i += 1) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.type = "image/avif";
          link.media = heroes[i].media;
          link.setAttribute("imagesrcset", heroes[i].srcset);
          link.setAttribute("imagesizes", "100vw");
          link.setAttribute("fetchpriority", "high");
          head.appendChild(link);
        }
        var italic = document.createElement("link");
        italic.rel = "preload";
        italic.as = "font";
        italic.type = "font/woff2";
        italic.crossOrigin = "anonymous";
        italic.href = "%PUBLIC_URL%/fonts/fraunces-v1-latin-italic.woff2";
        head.appendChild(italic);
      })();
    </script>

    <!-- =========================================
         Critical CSS (Above the Fold)
         ========================================= -->
    <style>
      /* Critical CSS - Inline for fastest first paint */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        /* 'Inter' here is the two-glyph U+26,U+2e subset loaded above — round
           full stop and open ampersand over Archivo. See the preload comment
           in <head>. */
        font-family: "Inter", "Archivo", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
        background-color: #ffffff;
        color: #0b0b0c;
        line-height: 1.5;
      }

      ::selection {
        background: #d5192e;
        color: #fff;
      }

      /* Root element setup */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        isolation: isolate;
      }

      /* Skip link for accessibility */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #0b0b0c;
        color: #ffffff;
        padding: 8px 16px;
        z-index: 10000;
        font-weight: 600;
        text-decoration: none;
        border-radius: 0 0 4px 0;
        transition: top 0.2s ease;
      }

      .skip-link:focus {
        top: 0;
      }

      /* ============================================
         Initial Loader — Branded Splash Screen
         Shown until React mounts, then fades out
         ============================================ */
      .initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0c;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }

      .initial-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Wrapper */
      .loader-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 24px;
        max-width: 280px;
        width: 100%;
      }

      /* Brand Block */
      .loader-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .loader-logo-img {
        /* The "DLS" mark is 860x460 (1.87:1), not the square "D" this splash
           used to draw — `aspect-ratio` reserves the right box before the PNG
           decodes so the wrapper never reflows on any device. `max-width`
           keeps it inside .loader-wrapper's 232px content box on the
           narrowest phones. Widened from the 180px the square "D" used: at
           1.87:1 the same width would draw a 96px-tall block where a 180px
           one stood, so the brand read as an afterthought above the 232px
           progress bar. */
        width: 200px;
        max-width: 100%;
        height: auto;
        aspect-ratio: 860 / 460;
        object-fit: contain;
        animation: loaderFadeIn 0.6s ease both;
      }

      .loader-tagline {
        margin: 0;
        font-family: "Inter", "Archivo", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.72);
        letter-spacing: 0.04em;
        text-align: center;
        animation: loaderFadeIn 0.6s 0.2s ease both;
      }

      /* Progress Bar Track */
      .loader-bar-track {
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
        overflow: hidden;
        animation: loaderFadeIn 0.4s 0.3s ease both;
      }

      .loader-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: linear-gradient(90deg, #e8293e, #f0293e, #a80e1e);
        background-size: 200% 100%;
        animation:
          loaderProgress 2s 0.4s ease-in-out forwards,
          loaderShimmer 1.5s 0.4s ease-in-out infinite;
      }

      /* Loading Status Text */
      .loader-status {
        margin: 0;
        font-family: "Inter", "Archivo", system-ui, sans-serif;
        font-size: 12px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 0.02em;
        animation: loaderFadeIn 0.4s 0.4s ease both;
      }

      /* Animated dots "Loading..." */
      .loader-dots::after {
        content: "";
        animation: loaderDots 1.4s steps(4, end) infinite;
      }

      /* ============================================
         Loader Keyframes
         ============================================ */
      @keyframes loaderFadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes loaderProgress {
        0% {
          width: 0%;
        }
        30% {
          width: 40%;
        }
        60% {
          width: 70%;
        }
        100% {
          width: 92%;
        }
      }

      @keyframes loaderShimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      @keyframes loaderDots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
        100% {
          content: "";
        }
      }

      /* Safe area for notched devices (iPhone X+) */
      @supports (padding-bottom: env(safe-area-inset-bottom)) {
        body {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }

      /* ============================================
         Reduced Motion — Respect user preference
         ============================================ */
      @media (prefers-reduced-motion: reduce) {
        .loader-logo-img,
        .loader-tagline,
        .loader-bar-track,
        .loader-status {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .loader-bar-fill {
          animation: loaderProgress 2s ease-in-out forwards;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

        html {
          scroll-behavior: auto;
        }
      }

      /* ============================================
         Dark mode support (if user's OS is dark)
         ============================================ */
      @media (prefers-color-scheme: dark) {
        .initial-loader {
          background: #0b0b0c;
        }
        .loader-tagline {
          color: rgba(255, 255, 255, 0.6);
        }
        .loader-bar-track {
          background: rgba(255, 255, 255, 0.1);
        }
        .loader-status {
          color: rgba(255, 255, 255, 0.4);
        }
      }

      /* High contrast mode support */
      @media (prefers-contrast: high) {
        body {
          background-color: #000;
          color: #fff;
        }
      }

      /* Print styles */
      @media print {
        .initial-loader {
          display: none !important;
        }
      }

      /* ============================================
         Public surface (IN-ARCH, prompt 04)
         --------------------------------------------
         Scoped to html[data-surface="public"], set by the first inline
         script, so the admin keeps today's splash and nothing above changes
         for it. The IN-ARCH splash shows only on the public surface: hidden
         on the admin, and hidden when JavaScript is off (no surface
         attribute), where the legacy rules above still apply.
         ============================================ */
      html[data-surface="public"] .initial-loader {
        display: none;
      }

      .ia-initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #161e19;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }

      html[data-surface="public"] .ia-initial-loader {
        display: flex;
      }

      html[data-surface="admin"] .ia-initial-loader {
        display: none;
      }

      .ia-initial-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* The ivory "IA" monogram, 56 px tall (266 × 190 source). */
      .ia-loader-mark {
        display: block;
        width: auto;
        height: 56px;
        aspect-ratio: 266 / 190;
      }

      /* A 120 px hairline that fills left to right. */
      .ia-loader-line {
        position: relative;
        display: block;
        width: 120px;
        height: 1px;
        overflow: hidden;
        background: #28342e;
      }

      .ia-loader-fill {
        position: absolute;
        inset: 0;
        display: block;
        background: #dda27f;
        transform: scaleX(0);
        transform-origin: 0 50%;
        animation: iaLoaderFill 2s 0.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }

      @keyframes iaLoaderFill {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(0.92);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ia-loader-fill {
          animation: none;
          transform: scaleX(1);
        }
      }

      @media print {
        .ia-initial-loader {
          display: none !important;
        }
      }
    </style>

    <!-- =========================================
         Surface script — runs last in <head>
         --------------------------------------------
         The first inline script sets data-surface before these tags exist,
         so the per-surface head changes happen here, once they do.
         - admin: the tab icons go back to today's files (public/legacy-icons/,
           byte copies of the Dulcey icons), both theme-color metas back to
           #0B0B0C, and the boot-time title back to today's — the admin's
           document chrome is unchanged until prompt 15.
         - public: preload the two IN-ARCH faces the shell uses on every page
           (crossorigin, or the font is fetched twice) and the splash mark.
           Never static tags: /admin must not request the new fonts.
         ========================================= -->
    <script>
      (function () {
        var root = document.documentElement;
        var head = document.head;
        var i;

        if (root.getAttribute("data-surface") === "admin") {
          var icons = head.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]');
          for (i = 0; i < icons.length; i += 1) {
            icons[i].setAttribute(
              "href",
              icons[i]
                .getAttribute("href")
                .replace(/\/(favicon\.ico|favicon\.png|apple-touch-icon\.png)$/, "/legacy-icons/$1"),
            );
          }
          var colours = head.querySelectorAll('meta[name="theme-color"]');
          for (i = 0; i < colours.length; i += 1) colours[i].setAttribute("content", "#0B0B0C");
          document.title = "Dulcey Lead Services — Beyond Business Support";
          return;
        }

        var fonts = ["manrope-v1-latin.woff2", "fraunces-v1-latin.woff2"];
        for (i = 0; i < fonts.length; i += 1) {
          var font = document.createElement("link");
          font.rel = "preload";
          font.as = "font";
          font.type = "font/woff2";
          font.crossOrigin = "anonymous";
          font.href = "%PUBLIC_URL%/fonts/" + fonts[i];
          head.appendChild(font);
        }

        var mark = document.createElement("link");
        mark.rel = "preload";
        mark.as = "image";
        mark.type = "image/png";
        mark.href = "%PUBLIC_URL%/images/brand/inarch-mark-on-dark-266.png";
        mark.setAttribute("fetchpriority", "high");
        head.appendChild(mark);
      })();
    </script>
  </head>
  <body>
    <!-- Noscript fallback -->
    <noscript>
      <div
        style="
          padding: 20px;
          text-align: center;
          background: #0b0b0c;
          color: #ffffff;
          font-family: Inter, Archivo, system-ui, sans-serif;
        "
      >
        <h1 style="color: #f0293e; margin-bottom: 10px">JavaScript Required</h1>
        <p>You need to enable JavaScript to run this app.</p>
        <p style="margin-top: 10px">
          Please enable JavaScript in your browser settings and refresh the
          page.
        </p>
      </div>
    </noscript>

    <!-- Initial Loader — Professional Branded Splash Screen -->
    <div
      class="initial-loader"
      id="initial-loader"
      role="progressbar"
      aria-label="Loading Dulcey Lead Services"
    >
      <div class="loader-wrapper">
        <!-- Logo + Brand -->
        <div class="loader-brand">
          <!-- The self-hosted "DLS" mark — the same artwork as the favicon
               and the PWA icon set. Drawn 180px wide from an 860px master, so
               it stays sharp to 3× with no CDN resize on the first-paint
               path. Mirrors `logoMark` / MARK_SIZE in src/data/siteConfig.js;
               preloaded in <head>. -->
          <img
            src="%PUBLIC_URL%/images/logo/dls-mark-860.png"
            alt="Dulcey Lead Services"
            class="loader-logo-img"
            width="860"
            height="460"
            decoding="async"
            fetchpriority="high"
          />
          <p class="loader-tagline">Beyond Business Support</p>
        </div>

        <!-- Animated Progress Bar -->
        <div class="loader-bar-track">
          <div class="loader-bar-fill"></div>
        </div>

        <!-- Loading text -->
        <p class="loader-status">Loading<span class="loader-dots"></span></p>
      </div>
    </div>

    <!-- IN-ARCH splash (public surface only; see the critical CSS). The mark
         is lazy so a hidden splash — on the admin — never requests it; on the
         public surface the surface script preloads it. -->
    <div
      class="ia-initial-loader"
      id="ia-initial-loader"
      role="progressbar"
      aria-label="Loading In-Arch Architects &amp; Interior Designer"
    >
      <img
        src="%PUBLIC_URL%/images/brand/inarch-mark-on-dark-266.png"
        alt=""
        class="ia-loader-mark"
        width="266"
        height="190"
        loading="lazy"
        decoding="async"
      />
      <span class="ia-loader-line" aria-hidden="true"
        ><span class="ia-loader-fill"></span
      ></span>
    </div>

    <!-- React Root -->
    <div id="root"></div>

    <!-- Hide initial loader when React is ready -->
    <script>
      (function () {
        // Performance mark for load timing
        if (window.performance && window.performance.mark) {
          window.performance.mark("loader-start");
        }

        // Hide loader on window load
        window.addEventListener("load", function () {
          // Give React time to mount
          setTimeout(function () {
            var loader = document.getElementById("initial-loader");
            if (loader) {
              loader.classList.add("hidden");

              // Remove from DOM after transition
              setTimeout(function () {
                if (loader && loader.parentNode) {
                  loader.style.display = "none";
                }

                // Performance mark for load complete
                if (window.performance && window.performance.mark) {
                  window.performance.mark("loader-end");
                  window.performance.measure(
                    "app-load-time",
                    "loader-start",
                    "loader-end",
                  );
                }
              }, 400);
            }

            // The IN-ARCH splash, the same way.
            var iaLoader = document.getElementById("ia-initial-loader");
            if (iaLoader) {
              iaLoader.classList.add("hidden");
              setTimeout(function () {
                iaLoader.style.display = "none";
              }, 400);
            }
          }, 200);
        });

        // Fallback: Hide loader after max timeout
        setTimeout(function () {
          var loader = document.getElementById("initial-loader");
          if (loader && !loader.classList.contains("hidden")) {
            loader.classList.add("hidden");
            setTimeout(function () {
              loader.style.display = "none";
            }, 400);
          }

          // The IN-ARCH splash, the same way.
          var iaLoader = document.getElementById("ia-initial-loader");
          if (iaLoader && !iaLoader.classList.contains("hidden")) {
            iaLoader.classList.add("hidden");
            setTimeout(function () {
              iaLoader.style.display = "none";
            }, 400);
          }
        }, 5000);
      })();
    </script>

    <!-- Register touch events for mobile performance -->
    <script>
      document.addEventListener("touchstart", function () {}, {
        passive: true,
      });
    </script>
  </body>
</html>
